worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ===== PERFORMANCE =====
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # ===== GZIP =====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ===== LOGGING =====
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ===== SECURITY HEADERS =====
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ===== RATE LIMITING =====
    limit_req_zone $binary_remote_addr zone=api:20m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload:5m rate=10r/m;
    limit_req_status 429;

    # ===== CONNECTION LIMITING =====
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ===== PROXY CACHE =====
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=10m;

    # ===== UPSTREAM SERVICES =====
    upstream auth_service {
        least_conn;
        server auth-service:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream core_api {
        least_conn;
        server core-api:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream chat_service {
        ip_hash;  # WebSocket sticky sessions
        server chat-service:3003 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ===== HTTP → HTTPS REDIRECT =====
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check (HTTP allowed)
        location /nginx-health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===== HTTPS SERVER =====
    server {
        listen 443 ssl http2;
        server_name api.rento.uz;

        # ===== SSL =====
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # ===== MAX BODY SIZE =====
        client_max_body_size 15m;

        # ===== CONNECTION LIMITS =====
        limit_conn conn_per_ip 50;

        # ===== PROXY COMMON =====
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # ===== HEALTH CHECK =====
        location /nginx-health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx","ssl":true}';
            add_header Content-Type application/json;
        }

        # ===== AUTH SERVICE =====
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://auth_service;
        }

        # ===== CORE API =====

        # E'lonlar ro'yxati — qisqa muddat keshlanadi
        location /api/v1/listings {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://core_api;
            proxy_cache api_cache;
            proxy_cache_valid 200 2m;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Qidiruv
        location /api/v1/listings/search {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://core_api;
            proxy_cache api_cache;
            proxy_cache_valid 200 1m;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Fayl yuklash (upload)
        location /api/v1/listings/upload {
            limit_req zone=upload burst=5 nodelay;
            client_max_body_size 50m;
            proxy_pass http://core_api;
        }

        # Barchasi Core API
        location /api/v1/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://core_api;
        }

        # ===== CHAT SERVICE — REST =====
        location /api/v1/chats/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://chat_service;
        }

        # ===== CHAT SERVICE — WEBSOCKET =====
        location /ws/ {
            proxy_pass http://chat_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # ===== STATIC FILES (MinIO proxied) =====
        location /uploads/ {
            proxy_pass http://minio:9000/rento-uploads/;
            proxy_set_header Host $host;
            proxy_hide_header x-amz-request-id;
            proxy_hide_header x-amz-id-2;
            proxy_cache api_cache;
            proxy_cache_valid 200 30d;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ===== DENY dotfiles =====
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ===== DEFAULT =====
        location / {
            return 404 '{"success":false,"error":{"message":"Not Found"}}';
            add_header Content-Type application/json;
        }
    }
}
