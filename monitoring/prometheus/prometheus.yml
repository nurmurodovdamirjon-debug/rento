global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alert manager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Alert rules
rule_files:
  - "/etc/prometheus/alert_rules.yml"

# Scrape configs
scrape_configs:
  # Prometheus o'zini monitoring qiladi
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Rento API (C# .NET)
  - job_name: "rento-api"
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["rento-api:5000"]
        labels:
          service: "rento-api"
          language: "csharp"

  # PostgreSQL (agar postgres-exporter qo'shilsa)
  # - job_name: "postgres"
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]

  # Redis (agar redis-exporter qo'shilsa)
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]

  # Nginx (agar nginx-exporter qo'shilsa)
  # - job_name: "nginx"
  #   static_configs:
  #     - targets: ["nginx-exporter:9113"]

  # Health checks
  - job_name: "health-checks"
    metrics_path: /health
    scrape_interval: 30s
    static_configs:
      - targets:
          - "rento-api:5000"
