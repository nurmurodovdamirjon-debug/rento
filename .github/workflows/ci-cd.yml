# ====================================================
# RENTO — CI/CD Pipeline
# ====================================================
# Trigger: push/PR to develop, main branches
# Jobs: lint → test → build → deploy
# ====================================================

name: RENTO CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ===== LINT =====
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, chat-service, core-api]
    steps:
      - uses: actions/checkout@v4

      # Node.js services
      - name: Setup Node.js
        if: matrix.service != 'core-api'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install & Lint (Node.js)
        if: matrix.service != 'core-api'
        working-directory: services/${{ matrix.service }}
        run: |
          npm ci
          npm run lint --if-present

      # Go service
      - name: Setup Go
        if: matrix.service == 'core-api'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/core-api/go.sum

      - name: Lint (Go)
        if: matrix.service == 'core-api'
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.57
          working-directory: services/core-api
          args: --timeout=5m

  # ===== TEST =====
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [auth-service, chat-service, core-api]

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: rento_test
          POSTGRES_USER: rento_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rento_test -d rento_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Node.js test
      - name: Setup Node.js
        if: matrix.service != 'core-api'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Test (Node.js)
        if: matrix.service != 'core-api'
        working-directory: services/${{ matrix.service }}
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: rento_test
          DB_USER: rento_test
          DB_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci
        run: |
          npm ci
          npm test -- --coverage --forceExit

      # Go test
      - name: Setup Go
        if: matrix.service == 'core-api'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/core-api/go.sum

      - name: Test (Go)
        if: matrix.service == 'core-api'
        working-directory: services/core-api
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: rento_test
          DB_USER: rento_test
          DB_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret-for-ci
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}/coverage/
            services/${{ matrix.service }}/coverage.out
          retention-days: 7

  # ===== BUILD DOCKER IMAGES =====
  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    strategy:
      matrix:
        service: [auth-service, chat-service, core-api]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== ACCEPTANCE TESTS =====
  acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start services
        run: |
          docker compose up -d --wait --timeout 120
        env:
          POSTGRES_PASSWORD: test_password
          REDIS_PASSWORD: test_redis
          JWT_SECRET: test-jwt-secret

      - name: Run acceptance tests
        working-directory: tests/acceptance
        env:
          API_URL: http://localhost:3002
          AUTH_URL: http://localhost:3001
          CHAT_URL: http://localhost:3003
        run: |
          npm ci
          npm test

      - name: Stop services
        if: always()
        run: docker compose down -v

  # ===== DEPLOY TO STAGING =====
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, acceptance]
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/rento
            git pull origin develop
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker system prune -f
            echo "Staging deploy complete: $(date)"

  # ===== DEPLOY TO PRODUCTION =====
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/rento
            git pull origin main

            # Backup before deploy
            /opt/rento/scripts/backup.sh

            # Deploy
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Health check
            sleep 30
            curl -sf http://localhost/nginx-health || (echo "Health check failed!" && exit 1)

            # Cleanup
            docker system prune -f
            echo "Production deploy complete: $(date)"

      - name: Notify on success
        if: success()
        run: echo "Production deployment successful"

      - name: Notify on failure
        if: failure()
        run: echo "Production deployment FAILED - manual rollback may be needed"
